services:
  postgres:
    image: postgres:16-alpine
    container_name: contador-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: contador_dev
    ports:
      - "5433:5432"
    volumes:
      - contador_pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  contador_pg_data: